# KataGo GTP config for go-trainer (9x9, HumanSL bot play).
#
# Mirrors BadukAI v1.23's gtp_static.cfg (decompiled) + KataGo's gtp_example.cfg.
# Differences from BadukAI are deliberate and commented.
#
# Phone-specific values (logDir, homeDataDir, numSearchThreads) are APPENDED by
# KataGoGtpEngine.stageIfNeeded() with absolute filesDir paths — the GTP child
# runs with cwd=/data/data (package-gate requirement), which is not writable.
#
# Play shaping (visits, temperature, HumanSL profile) is NOT here: BadukAI sets
# it at runtime via kata-set-param/kata-set-params so play and analysis can use
# different budgets on one persistent engine. We do the same (see
# KataGoGtpEngine.HUMAN_SL_PARAMS).

# --- Rules: match the trainer (Japanese, komi set via GTP `komi 7` at setup,
# --- same as every analysis query before the cutover; Scoring.KOMI = 7.0).
koRule = SIMPLE
scoringRule = AREA
taxRule = NONE
multiStoneSuicideLegal = false
hasButton = false
whiteHandicapBonus = N

# --- Bot behavior ---
allowResignation = true
# GTP mode REQUIRES resignThreshold present (analysis mode doesn't) — BadukAI's value.
resignThreshold = -0.9
resignConsecTurns = 20
ponderingEnabled = false
lagBuffer = 1.0
# Endgame/move speedup factors (BadukAI's — shorten pass/winning moves only).
searchFactorAfterOnePass = 0.50
searchFactorAfterTwoPass = 0.25
searchFactorWhenWinning = 0.40
searchFactorWhenWinningThreshold = 0.95

# --- Winrate perspective ---
# OUR UI CONTRACT IS BLACK-PERSPECTIVE (GameViewModel flips for White humans).
# BadukAI leaves the SIDETOMOVE default; we can't — pills/graph assume BLACK.
reportAnalysisWinratesAs = BLACK

# --- NN / threading ---
# numSearchThreads is appended at stage time: 2 on Eigen CPU (measured:
# 8T~2.7s/q, 2T~1.7s/q per 15 visits — oversubscription), 8 when a .dlc model
# is present (NPU path, BadukAI's dynamic value).
nnCacheSizePowerOfTwo = 21
nnMutexPoolSizePowerOfTwo = 16
numNNServerThreadsPerModel = 1
nnMaxBatchSize = 32

# --- Logging: lean on-device. Engine stderr goes to filesDir/katago-stderr.log
# --- (watched for diagnostics); GTP chatter would only bloat it.
logAllGTPCommunication = false
logSearchInfo = true
logToStderr = false
