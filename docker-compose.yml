services:
  server:
    build: ./server
    ports: ["3001:3001"]
    volumes:
      - ./server/models:/app/models:ro
      - ./server/config:/app/config:ro
    environment:
      PORT: 3001
      KATAGO_MODE: real
  app:
    image: node:20-slim
    working_dir: /app
    volumes: ["./app:/app", "/app/node_modules"]
    ports: ["5173:5173"]
    command: npm run dev -- --host 0.0.0.0
